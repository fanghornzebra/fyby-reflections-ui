<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Youth, By Youth — AI Enhanced Tracking & Evaluation System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --talloires-red: #cc1122;
    --talloires-blue: #1a3a6b;
    --talloires-blue-light: #2c5aa0;
    --panhari-red: #f11727;
    --panhari-orange: #e78a20;
    --panhari-orange-soft: #f5a623;
    --bg-warm: #faf8f5;
    --bg-card: #ffffff;
    --text-primary: #1a1a1a;
    --text-secondary: #5a5a5a;
    --text-muted: #94908a;
    --border: #e5e0d8;
    --border-hover: #ccc6bb;
    --shadow-card: 0 12px 48px rgba(26, 58, 107, 0.07), 0 2px 6px rgba(0,0,0,0.03);
    --shadow-button: 0 1px 3px rgba(0,0,0,0.06);
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg-warm);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    color: var(--text-primary);
    overflow-x: hidden;
  }

  /* === TOP ACCENT BAR === */
  .accent-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--talloires-blue) 0%, var(--talloires-red) 40%, var(--panhari-orange) 100%);
    z-index: 100;
  }

  /* === BACKGROUND === */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: 
      radial-gradient(ellipse at 10% 10%, rgba(231, 138, 32, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 90%, rgba(231, 138, 32, 0.05) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 50%, rgba(26, 58, 107, 0.02) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* === DOT PATTERNS === */
  .dot-pattern-tl {
    position: fixed;
    top: -40px;
    left: -60px;
    width: 380px;
    height: 380px;
    opacity: 0.14;
    z-index: 0;
    pointer-events: none;
  }
  .dot-pattern-br {
    position: fixed;
    bottom: -20px;
    right: -40px;
    width: 320px;
    height: 320px;
    opacity: 0.12;
    z-index: 0;
    pointer-events: none;
    transform: rotate(180deg);
  }

  /* === PAGE === */
  .page {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 24px 90px;
    min-height: 100vh;
  }

  /* === UNIFIED CARD === */
  .unified-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(0,0,0,0.04);
    width: 100%;
    max-width: 440px;
    overflow: hidden;
    animation: cardEntry 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* Top section — logo + title */
  .card-header {
    padding: 36px 36px 28px;
    text-align: center;
    background: linear-gradient(180deg, rgba(26, 58, 107, 0.018) 0%, transparent 100%);
    border-bottom: 1px solid rgba(0,0,0,0.04);
  }

  .logo-container {
    display: inline-block;
    margin-bottom: 20px;
  }
  .logo-container img {
    width: 240px;
    height: auto;
    display: block;
  }

  .card-header h1 {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 600;
    color: var(--talloires-blue);
    letter-spacing: -0.02em;
    line-height: 1.3;
    margin-bottom: 6px;
  }
  .card-header .system-label {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  /* Bottom section — auth */
  .card-body {
    padding: 32px 36px 36px;
  }

  .welcome-row {
    margin-bottom: 24px;
  }
  .welcome-row h2 {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }
  .welcome-row p {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  /* Auth buttons */
  .auth-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 13px 20px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--bg-card);
    font-family: 'DM Sans', sans-serif;
    font-size: 14.5px;
    font-weight: 500;
    color: var(--text-primary);
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-button);
    margin-bottom: 10px;
    text-decoration: none;
    position: relative;
    overflow: hidden;
  }
  .auth-btn::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0;
    background: linear-gradient(90deg, rgba(26, 58, 107, 0.04), transparent);
    transition: width 0.3s ease;
  }
  .auth-btn:hover {
    border-color: var(--talloires-blue-light);
    box-shadow: 0 2px 12px rgba(26, 58, 107, 0.1);
    transform: translateY(-1px);
  }
  .auth-btn:hover::before {
    width: 100%;
  }
  .auth-btn:active {
    transform: translateY(0);
    box-shadow: var(--shadow-button);
  }
  .auth-btn svg { width: 20px; height: 20px; flex-shrink: 0; position: relative; z-index: 1; }
  .auth-btn span { position: relative; z-index: 1; }

  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 18px 0 14px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .invite-note {
    text-align: center;
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* Terms */
  .terms {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 16px;
    padding: 0 36px 0;
    animation: fadeIn 0.6s ease-out 0.4s both;
  }
  .card-footer {
    padding: 0 36px 24px;
  }
  .terms a {
    color: var(--talloires-blue-light);
    text-decoration: none;
    font-weight: 500;
  }
  .terms a:hover { text-decoration: underline; }

  /* === POWERED BY FOOTER === */
  .powered-by {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px 24px 18px;
    background: linear-gradient(to top, rgba(250,248,245,1) 70%, rgba(250,248,245,0));
    z-index: 10;
    animation: fadeIn 1s ease-out 0.7s both;
  }
  .powered-by .label {
    font-size: 10.5px;
    color: #b0aba3;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 600;
  }
  .powered-by .panhari-mark {
    height: 36px;
    width: auto;
    opacity: 0.85;
    transition: opacity 0.3s ease;
  }
  .powered-by .panhari-text {
    height: 16px;
    width: auto;
    opacity: 0.45;
    transition: opacity 0.3s ease;
  }
  .powered-by:hover .panhari-mark,
  .powered-by:hover .panhari-text {
    opacity: 1;
  }
  .powered-by .version {
    font-size: 9.5px;
    color: #c5c0b8;
    margin-left: 2px;
    font-weight: 500;
  }

  /* === ANIMATIONS === */
  @keyframes cardEntry {
    from { opacity: 0; transform: translateY(24px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* === RESPONSIVE === */
  @media (max-width: 480px) {
    .page { padding: 48px 16px 90px; }
    .card-header { padding: 28px 24px 22px; }
    .card-body { padding: 24px 24px 28px; }
    .card-footer { padding: 0 24px 20px; }
    .logo-container img { width: 200px; }
    .card-header h1 { font-size: 20px; }
  }
</style>
